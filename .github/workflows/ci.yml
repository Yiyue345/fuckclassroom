name: CI

on:
  push:
    branches:
      - main
      - feat/course-media-viewer
      - feature/live-ppt-qr-assistant
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q fuckclassroom main.py select_course.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment

          env = Environment()
          for path in Path('templates').glob('*.html'):
              env.parse(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: JavaScript syntax check
        run: |
          for file in static/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

  wxscan-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select stable Rust
        run: rustup update stable && rustup default stable

      - name: Build and install PyO3 extension
        run: python -m pip install ./rust_module/wxscan_py

      - name: Smoke import native module
        run: python -c "import fuckclassroom_wxscan; assert hasattr(fuckclassroom_wxscan, 'Scanner')"
