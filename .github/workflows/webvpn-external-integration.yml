name: WebVPN external plugin integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      course_selection_ref:
        description: "Optional plugin ref for compatibility preflight (branch, tag or commit SHA)"
        required: false
        type: string
        default: main
      lab_selection_ref:
        description: "Optional lab plugin ref for compatibility preflight"
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  installed-zips:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout host PR
        uses: actions/checkout@v4
      - name: Checkout published standalone course selection source
        uses: actions/checkout@v4
        with:
          repository: Yiyue345/fuckclassroom-plugin-course-selection
          # Track the maintained branch; dispatch input allows an explicit PR/SHA preflight.
          ref: ${{ inputs.course_selection_ref || 'main' }}
          path: vendor-course
          persist-credentials: false
      - name: Checkout standalone lab selection
        uses: actions/checkout@v4
        with:
          repository: Yiyue345/fuckclassroom-plugin-lab-selection
          ref: ${{ inputs.lab_selection_ref || 'main' }}
          path: vendor-lab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install host dependencies
        run: python -m pip install -r requirements/all.txt
      - name: Build actual Registry-format plugin ZIPs
        run: |
          python vendor-course/scripts/build_registry_artifact.py 0.1.0-ci.0
          python vendor-lab/scripts/build_registry_artifact.py 0.1.0-ci.0
          (cd vendor-course && sha256sum -c course_selection-0.1.0-ci.0.zip.sha256)
          (cd vendor-lab && sha256sum -c lab_selection-0.1.0-ci.0.zip.sha256)
      - name: Exercise plugin manager ZIP installation, activation and session handoff
        env:
          COURSE_SELECTION_ZIP: ${{ github.workspace }}/vendor-course/course_selection-0.1.0-ci.0.zip
          LAB_SELECTION_ZIP: ${{ github.workspace }}/vendor-lab/lab_selection-0.1.0-ci.0.zip
        run: python -m unittest tests.test_webvpn_external_zips -v
