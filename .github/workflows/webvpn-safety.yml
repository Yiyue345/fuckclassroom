name: WebVPN session safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test WebVPN generation fencing and storage merge
        run: python -m unittest tests.test_webvpn_broker tests.test_webvpn_async_clear -v
