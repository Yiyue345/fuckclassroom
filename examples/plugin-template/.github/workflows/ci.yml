name: Validate plugin package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Registry v1 package
        run: python -m unittest discover -s tests -v
      - name: Build sample beta artifact
        run: python scripts/build_registry_artifact.py 0.1.0-beta.1
      - name: Verify release checksum
        run: |
          cd dist
          sha256sum -c -- *.sha256
