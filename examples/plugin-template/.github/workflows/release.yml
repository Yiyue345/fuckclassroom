name: Publish Registry v1 release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without the v prefix (e.g. 0.1.0 or 0.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate and package
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_registry_artifact.py "${{ inputs.version }}"
      - name: Verify checksum
        shell: bash
        run: |
          cd dist
          sha256sum -c -- *.sha256
      - name: Publish immutable tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ID="$(python -c 'import json; print(json.load(open("plugin.json", encoding="utf-8"))["id"])')"
          ASSET="dist/${ID}-${VERSION}.zip"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; publish a new version instead" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
          ARGS=()
          if [[ "${VERSION}" == *-* ]]; then ARGS+=(--prerelease); fi
          gh release create "${TAG}" "${ASSET}" "${ASSET}.sha256" \
            --verify-tag --title "${TAG}" --generate-notes "${ARGS[@]}"
