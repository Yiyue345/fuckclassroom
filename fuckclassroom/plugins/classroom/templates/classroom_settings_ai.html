<section class="settings-section" id="ai">
  <div><h2>AI 服务</h2><p>密钥只保存在本机设置文件中。</p></div>
  <div class="fields">
    <div class="field"><label for="ai_base_url">服务地址</label><input class="input mono" id="ai_base_url" name="ai_base_url" value="{{ settings.ai_base_url }}"></div>
    <div class="field-row"><div class="field"><label for="ai_model">总结模型</label><input class="input mono" id="ai_model" name="ai_model" value="{{ settings.ai_model }}"></div><div class="field"><label for="ocr_model">视觉 OCR 模型</label><input class="input mono" id="ocr_model" name="ocr_model" value="{{ settings.ocr_model }}"></div></div>
    <div class="field"><label for="ai_api_key">API Key</label><input class="input mono" id="ai_api_key" name="ai_api_key" type="password" autocomplete="off" placeholder="{% if settings.has_ai_api_key %}已保存，留空保持不变{% else %}未设置{% endif %}"><span class="field-hint">保存于 data/settings.json，请勿提交到仓库。</span></div>
    <label class="check-row"><input type="checkbox" name="auto_summarize_after_extract" {% if settings.auto_summarize_after_extract %}checked{% endif %}><span>文字提取完成后，自动将视频转写与 PPT 文本发送给 AI 生成总结</span></label>
    <p class="field-hint">未配置 API Key 时会自动跳过，不影响本地转写与 OCR 结果；也可以在课次结果页手动重新生成总结。</p>
  </div>
</section>
