<section class="settings-section" id="appearance">
  <div><h2>外观</h2><p>主题设置保存在当前浏览器。</p></div>
  <div class="fields"><div class="theme-options">
    <button class="theme-option" type="button" data-theme-option="light"><div class="theme-preview"><div class="theme-line"></div><div class="theme-line" style="width:68%"></div></div><div class="theme-name">浅色</div></button>
    <button class="theme-option" type="button" data-theme-option="dark"><div class="theme-preview dark"><div class="theme-line"></div><div class="theme-line" style="width:68%"></div></div><div class="theme-name">深色</div></button>
    <button class="theme-option" type="button" data-theme-option="auto"><div class="theme-preview auto"><div class="theme-line"></div><div class="theme-line" style="width:68%"></div></div><div class="theme-name">跟随系统</div></button>
  </div></div>
</section>
