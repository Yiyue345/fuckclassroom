<section class="settings-section" id="auto-selection">
  <div><h2>定时选课</h2></div>
  <div class="fields">
    <div class="field-row">
      <div class="field"><label for="auto_selection_retry_seconds">普通失败重试（秒）</label><input class="input" id="auto_selection_retry_seconds" name="auto_selection_retry_seconds" type="number" min="5" max="3600" step="1" value="{{ settings.auto_selection_retry_seconds }}"></div>
      <div class="field"><label for="auto_selection_session_retry_seconds">会话恢复重试（秒）</label><input class="input" id="auto_selection_session_retry_seconds" name="auto_selection_session_retry_seconds" type="number" min="15" max="3600" step="1" value="{{ settings.auto_selection_session_retry_seconds }}"></div>
    </div>
    <div class="field"><label for="auto_selection_capacity_retry_seconds">满课人数监测（秒）</label><input class="input" id="auto_selection_capacity_retry_seconds" name="auto_selection_capacity_retry_seconds" type="number" min="15" max="3600" step="1" value="{{ settings.auto_selection_capacity_retry_seconds }}"></div>
    <div class="field"><label for="catalog_lesson_name_targets">目标教学班名称</label><textarea class="input settings-textarea" id="catalog_lesson_name_targets" name="catalog_lesson_name_targets" rows="5" placeholder="每行一个教学班名称，最多 20 个">{{ settings.catalog_lesson_name_targets|join('\n') }}</textarea></div>
  </div>
</section>
