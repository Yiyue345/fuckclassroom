<section class="settings-section" id="ocr">
  <div><h2>PPT OCR</h2><p>配置课件图片识别、并发与缓存。</p></div>
  <div class="fields">
    <div class="field-row">
      <div class="field"><label for="ocr_engine">OCR 引擎</label><select class="select" id="ocr_engine" name="ocr_engine">{% for engine in ["auto", "rapidocr", "tesseract", "ai"] %}<option value="{{ engine }}" {% if settings.ocr_engine == engine %}selected{% endif %}>{{ engine }}</option>{% endfor %}</select></div>
      <div class="field"><label for="ocr_max_images">最多识别图片</label><input class="input" id="ocr_max_images" name="ocr_max_images" type="number" min="1" step="1" value="{{ settings.ocr_max_images }}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="ocr_workers">OCR 并发 Worker</label><input class="input" id="ocr_workers" name="ocr_workers" type="number" min="1" max="16" step="1" value="{{ settings.ocr_workers }}"></div>
      <div class="field"><label for="ocr_onnx_threads">每 Worker ONNX 线程</label><input class="input" id="ocr_onnx_threads" name="ocr_onnx_threads" type="number" min="1" max="16" step="1" value="{{ settings.ocr_onnx_threads }}"></div>
    </div>
    <div class="field"><label for="ocr_max_side">OCR 图片最大边</label><input class="input" id="ocr_max_side" name="ocr_max_side" type="number" min="512" max="4096" step="64" value="{{ settings.ocr_max_side }}"></div>
    <div class="field"><label for="ocr_model">视觉 OCR 模型</label><input class="input mono" id="ocr_model" name="ocr_model" value="{{ settings.ocr_model }}"><span class="field-hint">仅在 OCR 引擎选择 ai 时使用；AI 连接信息由 AI 总结插件或环境变量提供。</span></div>
    <label class="check-row"><input type="checkbox" name="ocr_cache_enabled" {% if settings.ocr_cache_enabled %}checked{% endif %}><span>启用 OCR 持久缓存</span></label>
    <label class="check-row"><input type="checkbox" name="ocr_use_angle_cls" {% if settings.ocr_use_angle_cls %}checked{% endif %}><span>启用 180° 文字方向分类</span></label>
  </div>
</section>
