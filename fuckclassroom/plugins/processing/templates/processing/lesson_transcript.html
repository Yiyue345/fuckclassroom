{% if media.video_url %}
                <form method="post" action="/courses/{{ detail.course.id }}/lessons/{{ lesson.id }}/extract" data-inline-task data-task-status="#course-task-status" data-task-group="course-extraction" data-task-starting="正在启动文字提取" data-task-fallback="文字提取失败" data-task-success="文字提取已完成">
                  <button class="resource-chip ready media-trigger" type="submit" data-task-submit><svg class="icon small"><use href="/static/icons.svg#captions"></use></svg>{{ "本地转写" if plugin_registry.is_enabled("transcription") else "提取文字" }}</button>
                </form>
{% else %}<span class="muted">暂无转写</span>{% endif %}
