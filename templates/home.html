<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>学习工具入口</title>
    <style>
      body { margin: 0; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f7f8fa; color: #1f2933; }
      main { box-sizing: border-box; max-width: 920px; margin: 0 auto; padding: 42px 20px; }
      h1 { margin: 0 0 24px; font-size: 30px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .card { display: block; border: 1px solid #d8dee6; border-radius: 8px; background: #fff; padding: 22px; color: inherit; text-decoration: none; }
      .card:hover { border-color: #2563eb; }
      h2 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0; color: #64748b; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>选择系统</h1>
      <section class="grid">
        <a class="card" href="/classroom">
          <h2>课程录播助手</h2>
          <p>课程资源、课件下载、转写提取、OCR 和 AI 总结。</p>
        </a>
        <a class="card" href="/selection">
          <h2>WebVPN 选课辅助</h2>
          <p>校外登录 WebVPN，打开本科教务系统，辅助定位选课页面中的目标课程。</p>
        </a>
      </section>
    </main>
  </body>
</html>
