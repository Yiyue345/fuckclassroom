<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>课程录制助手</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
        background: #f7f8fa;
        color: #1f2933;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        font-weight: 650;
      }

      .panel {
        border: 1px solid #d8dee6;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid #edf0f3;
      }

      .row:last-child {
        border-bottom: 0;
      }

      .label {
        color: #64748b;
      }

      .value {
        text-align: right;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      button {
        min-height: 38px;
        border: 1px solid #c8d1dc;
        border-radius: 6px;
        background: #ffffff;
        color: #1f2933;
        padding: 0 14px;
        cursor: pointer;
      }

      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #ffffff;
      }

      button.danger {
        border-color: #d14343;
        color: #b42318;
      }

      .hint {
        margin-top: 18px;
        color: #64748b;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>课程录制助手</h1>
      <section class="panel">
        <div class="row">
          <span class="label">会话状态</span>
          <strong class="value">{{ "已保存" if session.is_logged_in else "未登录" }}</strong>
        </div>
        <div class="row">
          <span class="label">说明</span>
          <span class="value">{{ session.message }}</span>
        </div>
        <div class="row">
          <span class="label">Cookie 数量</span>
          <span class="value">{{ session.cookie_count }}</span>
        </div>
        <div class="row">
          <span class="label">保存时间</span>
          <span class="value">{{ session.saved_at or "无" }}</span>
        </div>
        <div class="row">
          <span class="label">登录任务</span>
          <span class="value">{{ login_run.state }} - {{ login_run.message }}</span>
        </div>

        <div class="actions">
          <form method="get" action="/courses">
            <button type="submit">查看课程</button>
          </form>
          <form method="post" action="/auth/start">
            <button class="primary" type="submit">打开网页登录</button>
          </form>
          <form method="post" action="/auth/verify">
            <button type="submit">验证会话</button>
          </form>
          <form method="post" action="/auth/logout">
            <button class="danger" type="submit">清除会话</button>
          </form>
        </div>

        {% if login_run.state == "running" %}
          <p class="hint">登录窗口正在等待学校认证完成。本页可稍后刷新查看结果。</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
